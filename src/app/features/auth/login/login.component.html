 <div class="form-box login">
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="logoQore">
        <img src="/assets/logoQore.png" width="150px" alt="">
      </div>
      <h1>Inicia Sesión</h1>
      <div class="box">
        <div class="input-box">
        <input
          type="text"
          placeholder="DNI"
          id="dni"
          [(ngModel)]="credentials.dni"
          name="dni"
          #dniInput="ngModel"
          required
        />
          <i class="fa fa-envelope" aria-hidden="true"></i>
        </div>
      </div>
      

      <div class="input-box">
        <input
          type="password"
          id="password"
          [(ngModel)]="credentials.password"
          placeholder="CONTRASEÑA"
          name="password"
          required
        />
        <i class="fa fa-lock" aria-hidden="true"></i>
      </div>


      <button type="submit" class="btn" [disabled]="loginForm.invalid">Iniciar Sesión</button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
