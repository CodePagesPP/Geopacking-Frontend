<div class="container">

    <aside [class.active]="menuOpen">
        <div class="top">
            <div class="logo">
                <a><img src="assets/logoQore.png" alt=""></a>
            </div>
            <div class="close" id="close-btn" (click)="toggleMenu()">
            <span class="material-icons-sharp">close</span>
            </div>
        </div>

        <div class="sidebar">
        <a 
            routerLink="/dashboard" 
            (click)="setActive('dashboard')" 
            [class.active]="activeOption === 'dashboard'">
            <span class="material-icons-sharp active">dashboard_customize</span>
            <h3>Dashboard</h3>
        </a>

        <a 
            routerLink="/machines" 
            (click)="setActive('machines')" 
            [class.active]="activeOption === 'machines'">
            <span class="material-icons-sharp">
             precision_manufacturing
            </span>
            <h3>Machines</h3>
        </a>

        <a 
            routerLink="/clients" 
            (click)="setActive('clients')" 
            [class.active]="activeOption === 'clients'">
            <span class="material-icons-sharp">people</span>
            <h3>C</h3>
        </a>

        <a 
            routerLink="/workers" 
            (click)="setActive('workers')" 
            [class.active]="activeOption === 'workers'">
            <span class="material-icons-sharp">diversity_3</span>
            <h3>C</h3>
        </a>

        <a 
            class="menu-item" 
            (click)="toggleConfig(); setActive('config')" 
            [class.active]="activeOption === 'config'">
            <span class="material-icons-sharp">settings_applications</span>
            <h3>Configuración</h3>
            <span class="material-icons-sharp arrow">
            {{ showConfig ? 'expand_less' : 'expand_more' }}
            </span>
        </a>

        <ul *ngIf="showConfig" class="submenu">
            <li>
            <a routerLink="/roles" (click)="setActive('roles')" [class.active]="activeOption === 'roles'">
                <span class="material-icons-sharp">add_moderator</span>
                <h4>Roles</h4>
            </a>
            </li>
        </ul>

        <a style="cursor: pointer;" (click)="logout()">
            <span class="material-icons-sharp">logout</span>
            <h3>Cerrar Sesión</h3>
        </a>
        </div>

    </aside>

    <main>
        <router-outlet></router-outlet>
    </main> 

    <div class="right">
        <div class="top">
            <button id="menu-btn" (click)="toggleMenu()">
                <span class="material-icons-sharp">menu</span>
            </button>
            <div class="profile" *ngIf="user">
                <div class="info">
                    <p>Bienvenido, <b>{{user.name}}</b></p>
                    <div class="profile-photo">
                    <img src="https://cdn.pixabay.com/photo/2017/11/10/05/46/user-2935523_1280.png" alt="">
                    </div>
                </div>    
            </div>
        </div>
    </div>
</div>
